name: Schema parity

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: schema-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Drizzle migrations vs frozen Go contracts
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGPASSWORD: test
      ADMIN_URL: postgres://test:test@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: drizzle-kit migrate on a fresh PostGIS database
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE drizzle_fresh'
          DATABASE_URL=postgres://test:test@localhost:5432/drizzle_fresh bunx drizzle-kit migrate

      # Draft roll-out: the parity gate starts non-blocking while the mirror is
      # proven on CI, then becomes blocking. Tracked by ytci-mobile#378.
      - name: Schema parity (advisory)
        id: parity
        continue-on-error: true
        run: bun run db:parity
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/postgres

      - name: Parity summary
        if: always()
        run: |
          {
            echo "### Schema parity"
            echo ""
            echo "- drizzle-kit migrate: \`${{ job.status }}\`"
            echo "- parity outcome: \`${{ steps.parity.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

