openapi: "3.1.0"
info:
  title: YTCI Explorer Admin — Go API Contract
  version: "1.0.0"
  description: |
    API contract produced by ticket #8 — Admin ↔ Go API contract.
    The Go backend implements to this spec; the TanStack admin dashboard
    consumes it via a typed mock layer until Go lands.
    Spec source: docs/spec/ytci-extract.md
  contact:
    name: YTCI Team

servers:
  - url: https://api.yourdomain.com/v1
    description: Production (placeholder — replace before deploy)

paths:
  # ──────────────── Challenges ────────────────
  /challenges:
    get:
      summary: List challenges
      security: [{ BearerAuth: [] }]
      tags: [Challenges]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated list of challenges
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ChallengeSummary"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Create a new challenge
      security: [{ BearerAuth: [] }]
      tags: [Challenges]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeInput"
      responses:
        "201":
          description: Challenge created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /challenges/{id}:
    patch:
      summary: Update a challenge
      security: [{ BearerAuth: [] }]
      tags: [Challenges]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeInput"
      responses:
        "200":
          description: Challenge updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      summary: End a challenge (sets status to ended)
      security: [{ BearerAuth: [] }]
      tags: [Challenges]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Challenge ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /challenges/{id}/leaderboard:
    get:
      summary: Get challenge leaderboard
      security: [{ BearerAuth: [] }]
      tags: [Challenges]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    userId: { type: string }
                    userName: { type: string }
                    rank: { type: integer }
                    status: { type: string }
                    badgeAwardedAt: { type: string, format: date-time, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /challenges/evidence:
    get:
      summary: List submitted challenge evidence for moderation
      security: [{ BearerAuth: [] }]
      tags: [Challenges]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated evidence list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ChallengeEvidence"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /challenges/evidence/{id}/review:
    post:
      summary: Approve or reject challenge evidence
      security: [{ BearerAuth: [] }]
      tags: [Challenges]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeEvidenceReview"
      responses:
        "200":
          description: Evidence reviewed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ──────────────── Analytics ────────────────
  /analytics/summary:
    get:
      summary: Platform-level metrics
      security: [{ BearerAuth: [] }]
      tags: [Analytics]
      parameters: []
      responses:
        "200":
          description: Aggregated dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /analytics/destinations/top:
    get:
      summary: Top destinations by engagement
      security: [{ BearerAuth: [] }]
      tags: [Analytics]
      responses:
        "200":
          description: Ordered list of top destinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopDestination"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /analytics/stories:
    get:
      summary: Story moderation KPIs
      security: [{ BearerAuth: [] }]
      tags: [Analytics]
      responses:
        "200":
          description: Story metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryMetrics"
  /analytics/reports/export:
    post:
      summary: Generate and return a CSV/PDF report
      security: [{ BearerAuth: [] }]
      tags: [Analytics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format: { type: string, enum: [csv, pdf] }
                dateFrom: { type: string, format: date }
                dateTo: { type: string, format: date }
                sections:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Binary report file
          content:
            application/csv: {}
            application/pdf: {}

  # ──────────────── Destinations ────────────────
  /destinations:
    get:
      summary: List destinations (paginated)
      security: [{ BearerAuth: [] }]
      tags: [Destinations]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated destinations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/DestinationSummary"
    post:
      summary: Create a destination
      security: [{ BearerAuth: [] }]
      tags: [Destinations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationInput"
      responses:
        "201":
          description: Created destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationDetail"
        "422": { $ref: "#/components/responses/ValidationError" }
  /destinations/{id}:
    get:
      summary: Get destination by ID
      security: [{ BearerAuth: [] }]
      tags: [Destinations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Destination detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationDetail"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Partial update a destination
      security: [{ BearerAuth: [] }]
      tags: [Destinations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationInput"
      responses:
        "200":
          description: Updated destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationDetail"
    delete:
      summary: Delete (archive) a destination
      security: [{ BearerAuth: [] }]
      tags: [Destinations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted — no body }
  /destinations/bulk-import:
    post:
      summary: Bulk import destinations from CSV
      security: [{ BearerAuth: [] }]
      tags: [Destinations]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
                  errors: { type: array, items: { type: string } }

  # ──────────────── Media ────────────────
  /media:
    get:
      summary: List media assets (paginated)
      security: [{ BearerAuth: [] }]
      tags: [Media]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated media
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MediaItem"
    post:
      summary: Upload a media asset
      security: [{ BearerAuth: [] }]
      tags: [Media]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                caption: { type: string }
                altText: { type: string }
                credit: { type: string }
      responses:
        "201":
          description: Uploaded media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
  /media/{id}:
    patch:
      summary: Update media metadata
      security: [{ BearerAuth: [] }]
      tags: [Media]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caption: { type: string }
                altText: { type: string }
                credit: { type: string }
      responses:
        "200":
          description: Updated media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
    delete:
      summary: Remove media (hard delete)
      security: [{ BearerAuth: [] }]
      tags: [Media]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }

  # ──────────────── Stories (UGC Moderation) ────────────────
  /stories/moderation:
    get:
      summary: List stories pending moderation
      security: [{ BearerAuth: [] }]
      tags: [Moderation]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] } }
      responses:
        "200":
          description: Paginated moderation queue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ModerationItem"
  /stories/{id}/moderation:
    post:
      summary: Approve or reject a story
      security: [{ BearerAuth: [] }]
      tags: [Moderation]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [approve, reject] }
                reason: { type: string }
              required: [action]
      responses:
        "200":
          description: Story moderation status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
                  moderatedBy: { type: string }
                  moderatedAt: { type: string, format: date-time }
  /stories/{id}/report:
    post:
      summary: Report a story
      security: [{ BearerAuth: [] }]
      tags: [Moderation]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
                comment: { type: string }
              required: [reason]
      responses:
        "201": { description: Report submitted }

  # ──────────────── LMS (Courses) ────────────────
  /courses:
    get:
      summary: List courses
      security: [{ BearerAuth: [] }]
      tags: [LMS]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated courses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CourseSummary"
    post:
      summary: Create a course
      security: [{ BearerAuth: [] }]
      tags: [LMS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Created course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
  /courses/{id}:
    get:
      summary: Get course detail
      security: [{ BearerAuth: [] }]
      tags: [LMS]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Course detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
    patch:
      summary: Update course
      security: [{ BearerAuth: [] }]
      tags: [LMS]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "200":
          description: Updated course
    delete:
      summary: Delete course
      security: [{ BearerAuth: [] }]
      tags: [LMS]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
  /courses/{id}/lessons:
    post:
      summary: Create a lesson
      security: [{ BearerAuth: [] }]
      tags: [LMS]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Course ID }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonInput"
      responses:
        "201":
          description: Created lesson
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
  /courses/{id}/lessons/{lessonId}:
    patch:
      summary: Update a lesson
      security: [{ BearerAuth: [] }]
      tags: [LMS]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Course ID }
        - { name: lessonId, in: path, required: true, schema: { type: string }, description: Lesson ID }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonInput"
      responses:
        "200":
          description: Updated lesson
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
    delete:
      summary: Delete a lesson
      security: [{ BearerAuth: [] }]
      tags: [LMS]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Course ID }
        - { name: lessonId, in: path, required: true, schema: { type: string }, description: Lesson ID }
      responses:
        "200":
          description: Deleted lesson
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /courses/{id}/quiz:
    post:
      summary: Create or replace a quiz
      security: [{ BearerAuth: [] }]
      tags: [LMS]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Course ID }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizInput"
      responses:
        "200":
          description: Upserted quiz
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
    delete:
      summary: Delete a quiz
      security: [{ BearerAuth: [] }]
      tags: [LMS]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Course ID }
      responses:
        "200":
          description: Deleted quiz
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }

  # ──────────────── Conservation ────────────────
  /conservation/activities:
    get:
      summary: List conservation activities
      security: [{ BearerAuth: [] }]
      tags: [Conservation]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated activities
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ConservationActivity"
    post:
      summary: Create a conservation activity
      security: [{ BearerAuth: [] }]
      tags: [Conservation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                organizer: { type: string }
                location: { type: string }
                description: { type: string }
                date: { type: string, format: date }
                impactMetric: { type: string }
              required: [title, organizer, location, date]
      responses:
        "201":
          description: Created activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConservationActivity"
  /conservation/activities/{id}:
    patch:
      summary: Update activity
      security: [{ BearerAuth: [] }]
      tags: [Conservation]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Updated activity
  /conservation/evidence:
    get:
      summary: List evidence submissions
      security: [{ BearerAuth: [] }]
      tags: [Conservation]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated evidence items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            userId: { type: string }
                            activityId: { type: string }
                            description: { type: string }
                            imageUrl: { type: string, format: uri }
                            status: { type: string, enum: [pending, approved, rejected] }
                            submittedAt: { type: string, format: date-time }
  /conservation/evidence/{id}/review:
    post:
      summary: Review evidence submission
      security: [{ BearerAuth: [] }]
      tags: [Conservation]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [approve, reject] }
                note: { type: string }
              required: [action]
      responses:
        "200":
          description: Evidence reviewed

  # ──────────────── Events ────────────────
  /events:
    get:
      summary: List events
      security: [{ BearerAuth: [] }]
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/EventItem"
    post:
      summary: Create an event
      security: [{ BearerAuth: [] }]
      tags: [Events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                organizer: { type: string }
                county: { type: string }
                venue: { type: string }
                date: { type: string, format: date }
                type: { type: string, enum: [cultural, sports, conservation, tourism] }
                description: { type: string }
                contactEmail: { type: string, format: email }
              required: [title, organizer, county, date, type]
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventItem"
  /events/{id}:
    get:
      summary: Get event detail
      security: [{ BearerAuth: [] }]
      tags: [Events]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventItem"
    patch:
      summary: Update event
      security: [{ BearerAuth: [] }]
      tags: [Events]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Updated event
    delete:
      summary: Delete event
      security: [{ BearerAuth: [] }]
      tags: [Events]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
  /events/{id}/status:
    patch:
      summary: Transition event status (scheduled / postponed / cancelled)
      security: [{ BearerAuth: [] }]
      tags: [Events]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [scheduled, postponed, cancelled] }
              required: [status]
      responses:
        "200":
          description: Status updated

  # ──────────────── AI Config ────────────────
  /ai/config:
    get:
      summary: Get AI engine configuration
      security: [{ BearerAuth: [] }]
      tags: [AI Config]
      responses:
        "200":
          description: Current AI config
          content:
            application/json:
              schema:
