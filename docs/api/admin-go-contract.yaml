      security: [{ BearerAuth: [] }]
      tags: [Campaigns]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                bannerUrl: { type: string, format: uri }
                type: { type: string, enum: [home_banner, featured_destination, push_notification, seasonal] }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                targetUrl: { type: string }
              required: [title, type, startDate, endDate]
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
  /campaigns/{id}:
    get:
      summary: Get campaign detail
      security: [{ BearerAuth: [] }]
      tags: [Campaigns]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Campaign detail
    patch:
      summary: Update campaign
      security: [{ BearerAuth: [] }]
      tags: [Campaigns]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Updated campaign
    delete:
      summary: Delete campaign
      security: [{ BearerAuth: [] }]
      tags: [Campaigns]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }

  # ──────────────── Push Notifications ────────────────
  /push/send:
    post:
      summary: Send a push notification immediately
      security: [{ BearerAuth: [] }]
      tags: [Push]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                campaignId: { type: string, description: "Campaign to send from (must be type push_notification)" }
                title: { type: string }
                body: { type: string }
                imageUrl: { type: string, format: uri }
                audience:
                  $ref: "#/components/schemas/PushAudience"
              required: [campaignId, title, body, audience]
      responses:
        "202":
          description: Push send accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSendResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /push/schedule:
    post:
      summary: Schedule a push notification for future delivery
      security: [{ BearerAuth: [] }]
      tags: [Push]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                campaignId: { type: string }
                title: { type: string }
                body: { type: string }
                imageUrl: { type: string, format: uri }
                audience:
                  $ref: "#/components/schemas/PushAudience"
                scheduledAt: { type: string, format: date-time }
              required: [campaignId, title, body, audience, scheduledAt]
      responses:
        "202":
          description: Push scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSendResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /push/history:
    get:
      summary: List sent push notifications with delivery status
      security: [{ BearerAuth: [] }]
      tags: [Push]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated push history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/PushHistoryItem"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /push/history/{id}:
    get:
      summary: Get delivery details for a specific push send
      security: [{ BearerAuth: [] }]
      tags: [Push]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Push send detail with per-token delivery status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSendDetail"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /push/validate-tokens:
    post:
      summary: Validate a batch of Expo push tokens
      security: [{ BearerAuth: [] }]
      tags: [Push]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tokens:
                  type: array
                  items: { type: string }
              required: [tokens]
      responses:
        "200":
          description: Token validation results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PushTokenValidation"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /push/receipts:
    post:
      summary: Poll push receipts for a batch of ticket IDs
      security: [{ BearerAuth: [] }]
      tags: [Push]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ticketIds:
                  type: array
                  items: { type: string }
              required: [ticketIds]
      responses:
        "200":
          description: Push receipt results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushReceiptResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ──────────────── Users ────────────────
  /users:
    get:
      summary: List users (paginated)
      security: [{ BearerAuth: [] }]
      tags: [Users]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserItem"
    post:
      summary: Create a new user (admin)
      security: [{ BearerAuth: [] }]
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                name: { type: string }
                role: { type: string, enum: [user, super_admin, administrator, moderator, county_officer] }
                password: { type: string, writeOnly: true }
              required: [email, name, password]
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserItem"
  /users/{id}:
    get:
      summary: Get user detail
      security: [{ BearerAuth: [] }]
      tags: [Users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: User detail
    patch:
      summary: Update user
      security: [{ BearerAuth: [] }]
      tags: [Users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                role: { type: string, enum: [user, super_admin, administrator, moderator, county_officer] }
                email: { type: string, format: email }
      responses:
        "200":
          description: Updated user
    delete:
      summary: Delete user
      security: [{ BearerAuth: [] }]
      tags: [Users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
  /users/{id}/suspend:
    post:
      summary: Suspend or unsuspend a user
      security: [{ BearerAuth: [] }]
      tags: [Users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                suspend: { type: boolean }
                reason: { type: string }
              required: [suspend]
      responses:
        "200":
          description: User suspension status updated
  /users/{id}/role:
    post:
      summary: Change user role (super-admin only)
      security: [{ BearerAuth: [] }]
      tags: [Users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [user, super_admin, administrator, moderator, county_officer] }
              required: [role]
      responses:
        "200":
          description: User role updated
  /users/consent-audit:
    get:
      summary: List consent audit log entries
      security: [{ BearerAuth: [] }]
      tags: [Users]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated audit log
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            userId: { type: string }
                            action: { type: string }
                            details: { type: string }
                            timestamp: { type: string, format: date-time }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by TanStack Start /api/auth/jwks

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: Opaque cursor for cursor-based pagination
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      description: Page size (default 50, max 100)

  responses:
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code (e.g. INVALID_SLUG, USER_NOT_FOUND)
            message:
              type: string
              description: Human-readable error description
            details:
              type: object
              description: Optional structured context (field errors, IDs, etc.)

    Paginated:
      type: object
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page. null if there is no next page.
        hasMore:
          type: boolean
          description: false if the current page is the last

    # ── Analytics ──
    AnalyticsSummary:
      type: object
      properties:
        dau: { type: integer }
        wau: { type: integer }
        mau: { type: integer }
        newRegistrations: { type: integer }
        topDestinations:
          type: array
          items:
            $ref: "#/components/schemas/TopDestination"
        itinerariesGenerated: { type: integer }
        storiesSubmitted: { type: integer }
        courseEnrollments: { type: integer }
        conservationParticipants: { type: integer }
    TopDestination:
      type: object
      properties:
        name: { type: string }
        views: { type: integer }
    StoryMetrics:
      type: object
      properties:
        submitted: { type: integer }
        approved: { type: integer }
        rejected: { type: integer }
        pending: { type: integer }

    # ── Destinations ──
    DestinationSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        county: { type: string }
        category: { type: string }
        status: { type: string, enum: [draft, published, archived] }
        shortDescription: { type: string }
        updatedAt: { type: string, format: date-time }
    DestinationDetail:
      allOf:
        - $ref: "#/components/schemas/DestinationSummary"
        - type: object
          properties:
            latitude: { type: number }
            longitude: { type: number }
            fullDescription: { type: string }
            significance: { type: string }
            fees: { type: string }
            openingInfo: { type: string }
            transportNotes: { type: string }
            facilities: { type: string }
            safetyNotes: { type: string }
            heroImageUrl: { type: string, format: uri }
            createdAt: { type: string, format: date-time }
    DestinationInput:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        county: { type: string }
        category: { type: string }
        shortDescription: { type: string }
        fullDescription: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        fees: { type: string }
        openingInfo: { type: string }
        transportNotes: { type: string }
        facilities: { type: string }
        safetyNotes: { type: string }

    # ── Media ──
    MediaItem:
      type: object
      properties:
        id: { type: string }
        url: { type: string, format: uri, description: Time-limited signed GET URL }
        thumbnailUrl: { type: string, format: uri }
        altText: { type: string }
        caption: { type: string }
        credit: { type: string }
        type: { type: string, enum: [image, video, audio, pdf, 360] }
        status: { type: string, enum: [uploading, processing, ready, failed] }
        fileSizeBytes: { type: integer }
        createdAt: { type: string, format: date-time }

    # ── Moderation ──
    ModerationItem:
      type: object
      properties:
        id: { type: string }
        storyId: { type: string }
        creatorEmail: { type: string, format: email }
        caption: { type: string }
        mediaType: { type: string }
        mediaUrl: { type: string, format: uri }
        status: { type: string, enum: [pending, approved, rejected] }
        moderatedBy: { type: string, nullable: true }
        submittedAt: { type: string, format: date-time }

    # ── LMS ──
    CourseSummary:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        difficulty: { type: string, enum: [beginner, intermediate, advanced] }
        lessonCount: { type: integer }
        status: { type: string, enum: [draft, published] }
        updatedAt: { type: string, format: date-time }
    CourseDetail:
      allOf:
        - $ref: "#/components/schemas/CourseSummary"
        - type: object
          properties:
            description: { type: string }
            lessons:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  title: { type: string }
                  duration: { type: integer }
                  videoUrl: { type: string, format: uri }
            createdAt: { type: string, format: date-time }
    CourseInput:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        difficulty: { type: string, enum: [beginner, intermediate, advanced] }
        status: { type: string, enum: [draft, published] }
        imageUrl: { type: string, format: uri }
        passThreshold: { type: integer, minimum: 0, maximum: 100 }
        badgeName: { type: string }
        badgeIconUrl: { type: string, format: uri }

    # ── Lessons ──
    LessonInput:
      type: object
      required: [title, contentType]
      properties:
        title: { type: string }
        description: { type: string }
        contentType: { type: string, enum: [video, pdf, text] }
        contentUrl: { type: string, format: uri }
        duration: { type: integer }
        displayOrder: { type: integer }

    # ── Quiz ──
    QuizInput:
      type: object
      required: [title, questions]
      properties:
        title: { type: string }
        questions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              question: { type: string }
              options:
                type: array
                items: { type: string }
              correctIndex: { type: integer }
        passThreshold: { type: integer, minimum: 0, maximum: 100 }

    # ── Conservation ──
    ConservationActivity:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        organizer: { type: string }
        location: { type: string }
        description: { type: string }
        date: { type: string, format: date }
        impactMetric: { type: string }
        participantCount: { type: integer }
        status: { type: string, enum: [open, full, completed, cancelled] }
        badgeName: { type: string }
        badgeIconUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }

    # ── Events ──
    EventItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        organizer: { type: string }
        county: { type: string }
        venue: { type: string }
        date: { type: string, format: date }
        type: { type: string, enum: [cultural, sports, conservation, tourism] }
        status: { type: string, enum: [scheduled, postponed, cancelled] }
        description: { type: string }
        contactEmail: { type: string, format: email }
        createdAt: { type: string, format: date-time }

    # ── AI Config ──
    AiConfig:
      type: object
      properties:
        rateLimitPerMinute: { type: integer }
        tokenBudgetPerHour: { type: integer }
        fallbackEnabled: { type: boolean }
        modelTemperature: { type: number }
        maxTokens: { type: integer }
        guardrailBlockedTopics:
          type: array
          items: { type: string }
    AiConfigInput:
      type: object
      properties:
        rateLimitPerMinute: { type: integer }
        tokenBudgetPerHour: { type: integer }
        fallbackEnabled: { type: boolean }
        modelTemperature: { type: number, minimum: 0, maximum: 2 }
        maxTokens: { type: integer }
        guardrailBlockedTopics:
          type: array
          items: { type: string }
    AiSource:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string, format: uri }
        type: { type: string, enum: [database, api, document] }
        enabled: { type: boolean }
        addedAt: { type: string, format: date-time }

    # ── Campaigns ──
    Campaign:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        bannerUrl: { type: string, format: uri }
        type: { type: string, enum: [home_banner, featured_destination, push_notification, seasonal] }
        status: { type: string, enum: [draft, active, paused, ended] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        targetUrl: { type: string }
        createdAt: { type: string, format: date-time }

    # ── Push Notifications ──
    PushAudience:
      type: object
      properties:
        type:
          type: string
          enum: [all, county, role, interest]
          description: "Target audience selector"
        value:
          type: string
          description: "Value for the selector — county name, role name, interest tag; omitted when type=all"
        count:
          type: integer
          description: "Estimated device count for this audience (returned by preview endpoint)"
      required: [type]
    PushSendResult:
      type: object
      properties:
        sendId:
          type: string
          description: "Unique ID for this send — used to poll history/receipts"
        ticketIds:
          type: array
          items: { type: string }
          description: "Expo push ticket IDs (one per push token batch)"
        totalTokens:
          type: integer
          description: "Number of push tokens the notification was sent to"
        status:
          type: string
          enum: [pending, delivered, failed, partial]
      required: [sendId, status]
    PushHistoryItem:
      type: object
      properties:
        id: { type: string }
        campaignId: { type: string }
        title: { type: string }
        audience: { $ref: "#/components/schemas/PushAudience" }
        status: { type: string, enum: [pending, sent, scheduled, failed] }
        scheduledAt: { type: string, format: date-time, nullable: true }
        sentAt: { type: string, format: date-time, nullable: true }
        deliveredCount: { type: integer }
        failedCount: { type: integer }
        totalTarget: { type: integer }
        createdAt: { type: string, format: date-time }
    PushSendDetail:
      type: object
      properties:
        id: { type: string }
        campaignId: { type: string }
        title: { type: string }
        body: { type: string }
        imageUrl: { type: string, format: uri, nullable: true }
        audience: { $ref: "#/components/schemas/PushAudience" }
        status: { type: string, enum: [pending, sent, scheduled, failed] }
        scheduledAt: { type: string, format: date-time, nullable: true }
        sentAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        tokenResults:
          type: object
          properties:
            total: { type: integer }
            ok: { type: integer }
            deviceNotRegistered: { type: integer }
            messageTooBig: { type: integer }
            otherError: { type: integer }
        createdAt: { type: string, format: date-time }
    PushTokenValidation:
      type: object
      properties:
        token: { type: string }
        valid: { type: boolean }
        reason: { type: string, nullable: true }
    PushReceiptResponse:
      type: object
      properties:
        receipts:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, enum: [ok, error] }
              message: { type: string }
              details:
                type: object
                properties:
                  error:
                    type: string
                    enum: [DeviceNotRegistered, MessageTooBig, MessageRateExceeded, InvalidCredentials]

    # ── Challenges ──
    ChallengeSummary:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        rules: { type: string, nullable: true }
        badgeName: { type: string, nullable: true }
        badgeIconUrl: { type: string, format: uri, nullable: true }
        eligibility: { type: string, nullable: true, description: "JSON string of eligibility rules" }
        status: { type: string, enum: [draft, active, ended] }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        createdAt: { type: string, format: date-time }
    ChallengeInput:
      type: object
      required: [title, description, badgeName]
      properties:
        title: { type: string }
        description: { type: string }
        badgeName: { type: string }
        rules: { type: string }
        badgeIconUrl: { type: string, format: uri }
        eligibility: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    ChallengeEvidence:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        challengeId: { type: string }
        challengeTitle: { type: string }
        userName: { type: string }
        status: { type: string, enum: [submitted, approved, in_progress, rejected] }
        moderatedBy: { type: string, nullable: true }
        moderationNote: { type: string, nullable: true }
        badgeAwardedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    ChallengeEvidenceReview:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [approve, reject] }
        note: { type: string }
    ValidationErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    # ── Users ──
    UserItem:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [user, super_admin, administrator, moderator, county_officer] }
        banned: { type: boolean }
        banReason: { type: string, nullable: true }
        banExpires: { type: string, format: date-time, nullable: true }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }

security:
  - BearerAuth: []
