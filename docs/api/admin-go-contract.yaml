  # ──────────────── Campaigns ────────────────
  /campaigns:
    get:
      summary: List campaigns
      security: [{ BearerAuth: [] }]
      tags: [Campaigns]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated campaigns
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Campaign"
    post:
